name: ci

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HOME: ${{ github.workspace }}/.cargo

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    container:
      image: rust:1.87
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: rustc --version
      - run: cargo test

  saw-verify:
    runs-on: ubuntu-latest
    needs: cargo-test
    strategy:
      matrix:
        target: [verify-aes, verify-sha1, verify-sha2]
    container:
      image: ghcr.io/galoisinc/saw-suite:nightly
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Run SAW verification
        run: |
          . "$HOME/.cargo/env"
          mir-json --version
          crux-mir --version
          saw --version
          cargo --version
          make clean
          make ${{ matrix.target }}
