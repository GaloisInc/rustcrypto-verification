name: ci

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HOME: ${{ github.workspace }}/.cargo

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    container:
      image: rust:1.87
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: rustc --version
      - run: cargo test

  saw-verify:
    runs-on: ubuntu-latest
    needs: cargo-test
    strategy:
      matrix:
        target:
          - name: verify-aes
          - name: verify-sha1
          - name: verify-sha2
          - name: verify-aes-gcm
            iv-bytes: 1
          - name: verify-aes-gcm
            iv-bytes: 8
          - name: verify-aes-gcm
            iv-bytes: 12
          - name: verify-aes-gcm
            iv-bytes: 16
    container:
      image: ghcr.io/galoisinc/saw-suite:nightly
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Run SAW verification
        env:
          AES_GCM_SAW_IV_BYTES: ${{ matrix.target.iv-bytes }}
        run: |
          mir-json --version
          crux-mir --version
          saw --version
          cargo --version
          make ${{ matrix.target.name }}
